name: Daily Briefing

on:
  schedule:
    # 04:30 UTC corrisponde alle 06:30 CEST (ora legale) o 05:30 CET (ora solare)
    - cron: '30 5,11,17,21 * * *'
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser icalendar

      - name: Execute script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python digest.py
